Không chạy full suite sau micro-task; inspect diff và chỉ chạy focused verification khi root yêu cầu hoặc module đã hoàn tất.
Trả tối đa khoảng 6 dòng theo STATUS, SCOPE, CHANGED, BLOCKER, RISK, NEXT.
"""
