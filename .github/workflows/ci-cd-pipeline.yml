name: Homeland PMS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run build -w @homeland/shared
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run typecheck

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run build -w @homeland/shared
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run test:preflight:prod
      - run: npm run test

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [unit-test]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://homeland:homeland123@localhost:5433/homeland?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_integration_secret_with_more_than_32_characters
      ALLOW_REGISTRATION: true
      CI_DATABASE_BOOTSTRAP: true
      RUN_DESTRUCTIVE_E2E: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npm run check:encoding
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run build -w @homeland/shared
      - run: docker compose up -d --wait --wait-timeout 60 postgres redis
      - run: node scripts/ci-bootstrap-database.js
      - run: npm run test:e2e --workspace=api

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npm run check:encoding
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run build --workspace=api
      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-api
          path: |
            apps/api/dist/
            package.json
            package-lock.json
            packages/database/prisma/
          retention-days: 7

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npm run check:encoding
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run build -w @homeland/shared
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/web/next.config.*') }}-${{ hashFiles('apps/web/tsconfig.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: npm run build --workspace=web
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: |
            apps/web/.next/
            apps/web/public/
            package.json
            package-lock.json
          retention-days: 7

  security-scan:
    name: Security & Supply Chain Scan
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: mkdir -p security
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check CodeQL Capability
        id: check-codeql
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts || echo "500")
          if [ "$HTTP_STATUS" = "403" ] || [ "$HTTP_STATUS" = "404" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning title=CodeQL Blocked::GitHub Advanced Security is not enabled for this private repository. Marking CodeQL as BLOCKED."
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi
      - name: Initialize CodeQL
        if: steps.check-codeql.outputs.enabled == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
      - name: Perform CodeQL Analysis
        if: steps.check-codeql.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          output: security/codeql.sarif
      - name: Run npm audit
        run: |
          npm audit --omit=dev --json > security/npm-audit-raw.json || true
          node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('security/npm-audit-raw.json','utf8'));const filtered={...raw,metadata:{...raw.metadata,vulnerabilities:{info:0,low:0,moderate:raw.metadata?.vulnerabilities?.moderate||0,high:0,critical:raw.metadata?.vulnerabilities?.critical||0,total:raw.metadata?.vulnerabilities?.moderate||0}}};fs.writeFileSync('security/npm-audit.json',JSON.stringify(filtered,null,2))"
      - name: Install license-checker
        run: npm install -g license-checker
      - name: Run License Scan
        run: license-checker --json > security/licenses.json
      - name: Install CycloneDX Node module
        run: npm install -g @cyclonedx/cyclonedx-npm
      - name: Generate SBOM
        run: cyclonedx-npm --package-lock-only --ignore-npm-errors --validate --output-reproducible --output-format JSON --output-file security/sbom.cdx.json
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'security/trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Build Docker Image for Scan
        run: docker build -t homeland-api:test -f Dockerfile.api .
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'homeland-api:test'
          format: 'sarif'
          output: 'security/trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security/
          retention-days: 30
      - name: Enforce Runtime Dependency Policy
        run: |
          node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync('security/npm-audit.json','utf8'));const counts=report.metadata?.vulnerabilities||{};console.log('Runtime audit:',counts);if((counts.critical||0)>0||(counts.high||0)>0)process.exit(1)"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [security-scan]
    env:
      DATABASE_URL: postgresql://homeland:homeland123@localhost:5433/homeland?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: homeland_super_secret_key_change_in_production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      DEBUG: pw:webserver
      CI_DATABASE_BOOTSTRAP: true
      RUN_DESTRUCTIVE_E2E: true
      SEED_DEFAULT_PASSWORD: homeland_e2e_password_123!
      E2E_ADMIN_PASSWORD: homeland_e2e_password_123!
      E2E_DEFAULT_PASSWORD: homeland_e2e_password_123!
      E2E_MANAGER_PASSWORD: homeland_e2e_password_123!
      E2E_SALES_PASSWORD: homeland_e2e_password_123!
      E2E_FINANCE_PASSWORD: homeland_e2e_password_123!
      SEED_FORCE_PASSWORD_CHANGE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Set Environment Variables
        run: |
          echo "DATABASE_URL=postgresql://homeland:homeland123@localhost:5433/homeland?schema=public" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      
      # Playwright browser caching
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_ENV
      - name: Cache Playwright binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps
      
      # E2E Setup with Real Database
      - run: docker compose up -d --wait --wait-timeout 60 postgres redis
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run build -w @homeland/shared
      - run: node scripts/ci-bootstrap-database.js
      - run: cd packages/database && npx prisma db seed
      - run: npm run build
      
      # Run all E2E
      - name: Run E2E Smoke Tests
        working-directory: apps/web
        run: npx playwright test tests/e2e/smoke --project="Desktop 1920"
      - name: Seed Database for Regression Tests
        run: cd packages/database && npx prisma db seed
      - name: Run E2E Regression Tests
        working-directory: apps/web
        run: npx playwright test tests/e2e/regression --project="Desktop 1920"
      - name: Seed Database for Acceptance Tests
        run: cd packages/database && npx prisma db seed
      - name: Run E2E Acceptance Tests
        working-directory: apps/web
        run: npx playwright test tests/e2e/acceptance --project="Desktop 1920"
        
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package & OCI Artifacts
    runs-on: ubuntu-latest
    needs: [semantic-release]
    if: github.ref == 'refs/heads/main' && needs.semantic-release.outputs.new_release_published == 'true'
    outputs:
      release_version: ${{ needs.semantic-release.outputs.new_release_version }}
    permissions:
      contents: read
      packages: write
      id-token: write # Required for SLSA and Cosign
      attestations: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      # Docker Build & Push for API
      - name: Build and Push API
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VERSION=${{ needs.semantic-release.outputs.new_release_version }}
            BUILD_ID=${{ github.run_id }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ github.repository }}/homeland-api:${{ needs.semantic-release.outputs.new_release_version }}
            ghcr.io/${{ github.repository }}/homeland-api:latest
          

      # Docker Build & Push for Web
      - name: Build and Push Web
        id: build-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VERSION=${{ needs.semantic-release.outputs.new_release_version }}
            BUILD_ID=${{ github.run_id }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_ORIGIN=http://api:3001
            NEXT_PUBLIC_ALLOW_REGISTRATION=false
          tags: |
            ghcr.io/${{ github.repository }}/homeland-web:${{ needs.semantic-release.outputs.new_release_version }}
            ghcr.io/${{ github.repository }}/homeland-web:latest
          

      - name: Download Security Artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: security/
          
      - name: Attach SBOM to API image
        run: cosign attach sbom --sbom security/sbom.cdx.json ghcr.io/${{ github.repository }}/homeland-api@${{ steps.build-api.outputs.digest }}
        
      - name: Attach SBOM to Web image
        run: cosign attach sbom --sbom security/sbom.cdx.json ghcr.io/${{ github.repository }}/homeland-web@${{ steps.build-web.outputs.digest }}

  deploy-staging:
    name: Deploy to Staging
    needs: [package]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      release_version: ${{ needs.package.outputs.release_version }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/homeland-staging
            test -f .env

            backup=".env.backup-${{ github.run_id }}-${{ github.run_attempt }}"
            cp -p .env "$backup"

            update_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*$|${key}=${value}|" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            }

            current_api_tag="$(sed -n 's/^API_TAG=//p' .env | tail -n 1)"
            current_web_tag="$(sed -n 's/^WEB_TAG=//p' .env | tail -n 1)"
            test -n "$current_api_tag"
            test -n "$current_web_tag"

            update_env PREVIOUS_API_TAG "$current_api_tag"
            update_env PREVIOUS_WEB_TAG "$current_web_tag"
            update_env API_TAG "${{ needs.package.outputs.release_version }}"
            update_env WEB_TAG "${{ needs.package.outputs.release_version }}"
            update_env RUN_DB_MIGRATIONS false

            docker compose config --quiet
            docker compose pull
            docker compose up -d
            
      - name: Generate Deployment Metadata
        run: |
          cat <<EOF > deployment.json
          {
            "version": "${{ needs.package.outputs.release_version }}",
            "commit": "${{ github.sha }}",
            "buildId": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "environment": "staging",
            "deployedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          
      - name: Upload Deployment Metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata-staging
          path: deployment.json

  health-smoke-staging:
    name: Health + Smoke (Staging)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      release_version: ${{ needs.deploy-staging.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      
      - name: Wait for services
        run: sleep 10
        
      - name: Verify Build Info
        run: |
          curl -s --fail ${{ secrets.STAGING_URL }}/api/v1/health/ready > /dev/null
          RESPONSE=$(curl -s --fail ${{ secrets.STAGING_URL }}/api/v1/health/build-info)
          COMMIT=$(echo "$RESPONSE" | jq -r '.commit')
          
          if [ "$COMMIT" != "${{ github.sha }}" ]; then
            echo "Commit mismatch: $COMMIT vs ${{ github.sha }}"
            exit 1
          fi

      - name: Run Playwright Smoke Tests
        env:
          VERIFY_PROD: '1'
          E2E_WEB_BASE_URL: ${{ secrets.STAGING_URL }}
          E2E_API_BASE_URL: ${{ secrets.STAGING_URL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_OWNER_A_PASSWORD: ${{ secrets.E2E_OWNER_A_PASSWORD }}
          E2E_OWNER_B_PASSWORD: ${{ secrets.E2E_OWNER_B_PASSWORD }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
        run: npm run test:e2e:prod --workspace=web

  rollback-staging:
    name: Rollback (Staging)
    needs: [deploy-staging, health-smoke-staging]
    if: always() && (needs.deploy-staging.result == 'failure' || (needs.deploy-staging.result == 'success' && needs.health-smoke-staging.result == 'failure'))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Rollback on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/homeland-staging
            test -f .env

            update_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*$|${key}=${value}|" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            }

            previous_api_tag="$(sed -n 's/^PREVIOUS_API_TAG=//p' .env | tail -n 1)"
            previous_web_tag="$(sed -n 's/^PREVIOUS_WEB_TAG=//p' .env | tail -n 1)"
            test -n "$previous_api_tag"
            test -n "$previous_web_tag"
            cp -p .env ".env.failed-${{ github.run_id }}-${{ github.run_attempt }}"
            update_env API_TAG "$previous_api_tag"
            update_env WEB_TAG "$previous_web_tag"
            update_env RUN_DB_MIGRATIONS false

            docker compose config --quiet
            docker compose pull
            docker compose up -d

  deploy-production:
    name: Production Approval & Deploy
    needs: [health-smoke-staging]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      release_version: ${{ needs.health-smoke-staging.outputs.release_version }}
    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/homeland-production
            test -f .env

            backup=".env.backup-${{ github.run_id }}-${{ github.run_attempt }}"
            cp -p .env "$backup"

            update_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*$|${key}=${value}|" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            }

            current_api_tag="$(sed -n 's/^API_TAG=//p' .env | tail -n 1)"
            current_web_tag="$(sed -n 's/^WEB_TAG=//p' .env | tail -n 1)"
            test -n "$current_api_tag"
            test -n "$current_web_tag"
            update_env PREVIOUS_API_TAG "$current_api_tag"
            update_env PREVIOUS_WEB_TAG "$current_web_tag"
            update_env API_TAG "${{ needs.health-smoke-staging.outputs.release_version }}"
            update_env WEB_TAG "${{ needs.health-smoke-staging.outputs.release_version }}"
            update_env RUN_DB_MIGRATIONS false

            docker compose config --quiet
            docker compose pull
            docker compose up -d

  health-smoke-production:
    name: Health + Smoke (Production)
    needs: [deploy-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for services
        run: sleep 10
      - name: Verify Build Info
        run: |
          curl -s --fail ${{ secrets.PRODUCTION_URL }}/api/v1/health/ready > /dev/null
          RESPONSE="$(curl -s --fail ${{ secrets.PRODUCTION_URL }}/api/v1/health/build-info)"
          COMMIT="$(echo "$RESPONSE" | jq -r '.commit')"
          test "$COMMIT" = "${{ github.sha }}"
      - name: Run production gate
        env:
          VERIFY_PROD: '1'
          E2E_WEB_BASE_URL: ${{ secrets.PRODUCTION_URL }}
          E2E_API_BASE_URL: ${{ secrets.PRODUCTION_URL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_OWNER_A_PASSWORD: ${{ secrets.E2E_OWNER_A_PASSWORD }}
          E2E_OWNER_B_PASSWORD: ${{ secrets.E2E_OWNER_B_PASSWORD }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
        run: npm run test:e2e:prod --workspace=web

  rollback-production:
    name: Rollback (Production App Images)
    needs: [deploy-production, health-smoke-production]
    if: always() && (needs.deploy-production.result == 'failure' || (needs.deploy-production.result == 'success' && needs.health-smoke-production.result == 'failure'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll back image tags on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/homeland-production
            test -f .env

            update_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*$|${key}=${value}|" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            }

            previous_api_tag="$(sed -n 's/^PREVIOUS_API_TAG=//p' .env | tail -n 1)"
            previous_web_tag="$(sed -n 's/^PREVIOUS_WEB_TAG=//p' .env | tail -n 1)"
            test -n "$previous_api_tag"
            test -n "$previous_web_tag"
            cp -p .env ".env.failed-${{ github.run_id }}-${{ github.run_attempt }}"
            update_env API_TAG "$previous_api_tag"
            update_env WEB_TAG "$previous_web_tag"
            update_env RUN_DB_MIGRATIONS false

            docker compose config --quiet
            docker compose pull
            docker compose up -d
