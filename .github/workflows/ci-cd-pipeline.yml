name: Homeland PMS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run typecheck

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run test

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: docker compose up -d postgres redis
      - run: npm run test:e2e --workspace=api

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run build --workspace=api
      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-api
          path: |
            apps/api/dist/
            package.json
            package-lock.json
            packages/database/prisma/
          retention-days: 7

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/web/next.config.*') }}-${{ hashFiles('apps/web/tsconfig.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: npm run build --workspace=web
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: |
            apps/web/.next/
            apps/web/public/
            package.json
            package-lock.json
          retention-days: 7

  security-scan:
    name: Security & Supply Chain Scan
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: mkdir -p security
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # - name: Initialize CodeQL
      #   uses: github/codeql-action/init@v3
      #   with:
      #     languages: javascript, typescript
      # - name: Perform CodeQL Analysis
      #   uses: github/codeql-action/analyze@v3
      #   with:
      #     output: security/codeql.sarif
      - name: Run npm audit
        run: npm audit --json > security/npm-audit.json || true
      - name: Install license-checker
        run: npm install -g license-checker
      - name: Run License Scan
        run: license-checker --json > security/licenses.json
      - name: Install CycloneDX Node module
        run: npm install -g @cyclonedx/cyclonedx-npm
      - name: Generate SBOM
        run: cyclonedx-npm --output-format JSON --output-file security/sbom.cdx.json
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'security/trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Build Docker Image for Scan
        run: docker build -t homeland-api:test -f Dockerfile.api .
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'homeland-api:test'
          format: 'sarif'
          output: 'security/trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security/
          retention-days: 30

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security-scan]
    env:
      DATABASE_URL: postgresql://homeland:homeland123@localhost:5433/homeland?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: homeland_super_secret_key_change_in_production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      DEBUG: pw:webserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Set Environment Variables
        run: |
          echo "DATABASE_URL=postgresql://homeland:homeland123@localhost:5433/homeland?schema=public" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: npm ci
      
      # Playwright browser caching
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=\$(npx playwright --version | awk '{print \$2}')" >> \$GITHUB_ENV
      - name: Cache Playwright binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps
      
      # E2E Setup with Real Database
      - run: docker compose up -d postgres redis
      - run: sleep 5
      - run: npx prisma db execute --file packages/database/prisma/sql/enable-pgvector.sql --schema packages/database/prisma/schema.prisma
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npx prisma db push --schema=packages/database/prisma/schema.prisma
      - run: cd packages/database && npx prisma db seed
      - run: npm run build
      
      # Run all E2E
      - name: Run E2E Smoke Tests
        working-directory: apps/web
        run: npx playwright test tests/e2e/smoke
      - name: Run E2E Regression Tests
        working-directory: apps/web
        run: npx playwright test tests/e2e/regression
      - name: Run E2E Acceptance Tests
        working-directory: apps/web
        run: npx playwright test tests/e2e/acceptance
        
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package & OCI Artifacts
    runs-on: ubuntu-latest
    needs: [semantic-release]
    if: github.ref == 'refs/heads/main' && needs.semantic-release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write # Required for SLSA and Cosign
      attestations: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      # Docker Build & Push for API
      - name: Build and Push API
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VERSION=${{ needs.semantic-release.outputs.new_release_version }}
            BUILD_ID=${{ github.run_id }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ github.repository }}/homeland-api:${{ needs.semantic-release.outputs.new_release_version }}
            ghcr.io/${{ github.repository }}/homeland-api:latest
          
      - name: Attest API Build Provenance (SLSA Level 3)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/homeland-api
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true
          
      - name: Sign API image with Cosign
        run: cosign sign --yes ghcr.io/${{ github.repository }}/homeland-api@${{ steps.build-api.outputs.digest }}

      # Docker Build & Push for Web
      - name: Build and Push Web
        id: build-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VERSION=${{ needs.semantic-release.outputs.new_release_version }}
            BUILD_ID=${{ github.run_id }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ github.repository }}/homeland-web:${{ needs.semantic-release.outputs.new_release_version }}
            ghcr.io/${{ github.repository }}/homeland-web:latest
          
      - name: Attest Web Build Provenance (SLSA Level 3)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/homeland-web
          subject-digest: ${{ steps.build-web.outputs.digest }}
          push-to-registry: true
          
      - name: Sign Web image with Cosign
        run: cosign sign --yes ghcr.io/${{ github.repository }}/homeland-web@${{ steps.build-web.outputs.digest }}

      - name: Download Security Artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: security/
          
      - name: Attach SBOM to API image
        run: cosign attach sbom --sbom security/sbom.cdx.json ghcr.io/${{ github.repository }}/homeland-api@${{ steps.build-api.outputs.digest }}
        
      - name: Attach SBOM to Web image
        run: cosign attach sbom --sbom security/sbom.cdx.json ghcr.io/${{ github.repository }}/homeland-web@${{ steps.build-web.outputs.digest }}

  deploy-staging:
    name: Deploy to Staging
    needs: [package]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/homeland-staging
            
            # Backup current tags
            source .env
            echo "PREVIOUS_API_TAG=\$API_TAG" > .env.tmp
            echo "PREVIOUS_WEB_TAG=\$WEB_TAG" >> .env.tmp
            
            # Set new tags
            echo "API_TAG=${{ needs.semantic-release.outputs.new_release_version }}" >> .env.tmp
            echo "WEB_TAG=${{ needs.semantic-release.outputs.new_release_version }}" >> .env.tmp
            
            mv .env.tmp .env
            
            # Pull and Restart
            docker compose pull
            docker compose up -d
            
      - name: Generate Deployment Metadata
        run: |
          cat <<EOF > deployment.json
          {
            "version": "${{ needs.semantic-release.outputs.new_release_version }}",
            "commit": "${{ github.sha }}",
            "buildId": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "environment": "staging",
            "deployedAt": "\$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          
      - name: Upload Deployment Metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata-staging
          path: deployment.json

  health-smoke-staging:
    name: Health + Smoke (Staging)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      
      - name: Wait for services
        run: sleep 10
        
      - name: Verify Build Info
        run: |
          RESPONSE=\$(curl -s --fail ${{ secrets.STAGING_URL }}/api/v1/health/build-info)
          COMMIT=\$(echo \$RESPONSE | jq -r '.commit')
          
          if [ "\$COMMIT" != "${{ github.sha }}" ]; then
            echo "Commit mismatch: \$COMMIT vs ${{ github.sha }}"
            exit 1
          fi

      - name: Run Playwright Smoke Tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_URL }}
        run: npx playwright test --project=smoke

  rollback-staging:
    name: Rollback (Staging)
    needs: [health-smoke-staging]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rollback on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/homeland-staging
            source .env
            
            # Swap back tags
            echo "API_TAG=\$PREVIOUS_API_TAG" > .env.tmp
            echo "WEB_TAG=\$PREVIOUS_WEB_TAG" >> .env.tmp
            mv .env.tmp .env
            
            docker compose pull
            docker compose up -d

  deploy-production:
    name: Production Approval & Deploy
    needs: [health-smoke-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/homeland-production
            source .env
            echo "PREVIOUS_API_TAG=\$API_TAG" > .env.tmp
            echo "PREVIOUS_WEB_TAG=\$WEB_TAG" >> .env.tmp
            echo "API_TAG=${{ needs.semantic-release.outputs.new_release_version }}" >> .env.tmp
            echo "WEB_TAG=${{ needs.semantic-release.outputs.new_release_version }}" >> .env.tmp
            mv .env.tmp .env
            
            docker compose pull
            docker compose up -d
