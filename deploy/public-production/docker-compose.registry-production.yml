name: homeland_public_production

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: homeland_production_postgres
    environment:
      POSTGRES_USER: homeland
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: homeland
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeland -d homeland"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: homeland_production_redis
    ports:
      - "${REDIS_HOST_PORT}:6379"
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/tcandt/homeland-saas/homeland-api}:${API_TAG:-v1.2.0}
    container_name: homeland_production_api
    env_file:
      - .env.public-production
    environment:
      PORT: ${API_CONTAINER_PORT}
      NODE_ENV: production
      APP_RUNTIME_ROLE: ${APP_RUNTIME_ROLE_API:-api}
      DATABASE_URL: postgresql://homeland:${POSTGRES_PASSWORD}@postgres:5432/homeland?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      COMMUNICATION_IMMEDIATE_DELIVERY: ${COMMUNICATION_IMMEDIATE_DELIVERY:-false}
      NOTIFICATION_WORKER_HEARTBEAT_PATH: /app/.codex-runtime/notification-worker-heartbeat.json
      BACKUP_MANIFEST_PATH: /app/.codex-backups/production/latest-manifest.json
      BACKUP_RETENTION_REPORT_PATH: /app/.codex-backups/production/latest-retention-report.json
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-false}
      SYSTEM_UPDATE_MODE: ${SYSTEM_UPDATE_MODE:-enabled}
      SYSTEM_UPDATE_ALLOW_SWITCH: ${SYSTEM_UPDATE_ALLOW_SWITCH:-false}
      SYSTEM_UPDATE_RESTART_COMMAND: ${SYSTEM_UPDATE_RESTART_COMMAND:-}
      SYSTEM_UPDATE_ROOT: ${SYSTEM_UPDATE_ROOT:-/app/.codex-update}
      SYSTEM_UPDATE_RUN_BUILD: ${SYSTEM_UPDATE_RUN_BUILD:-true}
      SYSTEM_UPDATE_API_HEALTH_URL: http://api:${API_CONTAINER_PORT}/api/v1/health/ready
      SYSTEM_UPDATE_WEB_HEALTH_URL: http://web:${WEB_CONTAINER_PORT}/login
      APP_VERSION: ${API_TAG:-latest}
    volumes:
      - documents_production_storage:/app/storage
      - system_update_production:/app/.codex-update
      - system_update_production_backups:/app/.codex-backups/system-update
      - production_backups:/app/.codex-backups/production
      - operations_runtime:/app/.codex-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${API_HOST_PORT}:${API_CONTAINER_PORT}"
    restart: unless-stopped

  notification_worker:
    image: ${API_IMAGE:-ghcr.io/tcandt/homeland-saas/homeland-api}:${API_TAG:-v1.2.0}
    container_name: homeland_production_notification_worker
    env_file:
      - .env.public-production
    environment:
      PORT: ${API_CONTAINER_PORT}
      NODE_ENV: production
      APP_RUNTIME_ROLE: ${APP_RUNTIME_ROLE_WORKER:-notification-worker}
      DATABASE_URL: postgresql://homeland:${POSTGRES_PASSWORD}@postgres:5432/homeland?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COMMUNICATION_IMMEDIATE_DELIVERY: "false"
      NOTIFICATION_WORKER_HEARTBEAT_PATH: /app/.codex-runtime/notification-worker-heartbeat.json
      BACKUP_MANIFEST_PATH: /app/.codex-backups/production/latest-manifest.json
      BACKUP_RETENTION_REPORT_PATH: /app/.codex-backups/production/latest-retention-report.json
      RUN_DB_MIGRATIONS: "false"
      SYSTEM_UPDATE_MODE: ${SYSTEM_UPDATE_MODE:-enabled}
      APP_VERSION: ${API_TAG:-latest}
    volumes:
      - production_backups:/app/.codex-backups/production
      - operations_runtime:/app/.codex-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/tcandt/homeland-saas/homeland-web}:${WEB_TAG:-v1.2.0}
    container_name: homeland_production_web
    env_file:
      - .env.public-production
    environment:
      NODE_ENV: production
      PORT: ${WEB_CONTAINER_PORT}
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_ORIGIN: http://api:${API_CONTAINER_PORT}
      NEXT_TELEMETRY_DISABLED: "1"
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      NEXT_PUBLIC_MAINTENANCE_MODE: ${NEXT_PUBLIC_MAINTENANCE_MODE:-false}
      MAINTENANCE_BYPASS_KEY: ${MAINTENANCE_BYPASS_KEY:-}
      APP_VERSION: ${WEB_TAG:-latest}
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT}:${WEB_CONTAINER_PORT}"
    restart: unless-stopped

volumes:
  postgres_production_data:
  documents_production_storage:
  system_update_production:
  system_update_production_backups:
  production_backups:
  operations_runtime:
