version: '3.8'

# Monitoring stack — run alongside main docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

services:
  # ── Metrics ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: homeland_prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/rules/prometheus-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    networks:
      - homeland_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: homeland_alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - homeland_net

  # ── Log Aggregation ───────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: homeland_loki
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - homeland_net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: homeland_promtail
    restart: unless-stopped
    ports:
      - '9080:9080'
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    networks:
      - homeland_net
    depends_on:
      - loki

  # ── Distributed Tracing ───────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.0
    container_name: homeland_tempo
    restart: unless-stopped
    ports:
      - '3200:3200'   # Tempo HTTP API
      - '4317:4317'   # OTLP gRPC receiver
      - '4318:4318'   # OTLP HTTP receiver
    volumes:
      - ./monitoring/tempo-config.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo.yml
    networks:
      - homeland_net

  # ── Visualization ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: homeland_grafana
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=homeland_grafana
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor,newVizTooltips
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - homeland_net
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  promtail_positions:
  tempo_data:

networks:
  homeland_net:
    external: true
    name: homeland-saas_default
