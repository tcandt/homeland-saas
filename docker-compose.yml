version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: homeland_postgres
    environment:
      POSTGRES_USER: homeland
      POSTGRES_PASSWORD: homeland123
      POSTGRES_DB: homeland
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeland -d homeland"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: homeland_redis
    ports:
      - "6379:6379"
    restart: unless-stopped



volumes:
  postgres_data:
