global:
  # How long to wait before re-sending an alert
  resolve_timeout: 5m

route:
  # Default catch-all route
  receiver: 'default-webhook'
  group_by: ['alertname', 'severity', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts → immediate, all channels
    - matchers:
        - severity = "critical"
      receiver: 'critical-webhook'
      repeat_interval: 1h

    # AI team alerts
    - matchers:
        - team = "ai"
      receiver: 'ai-team-webhook'

    # SLO burn alerts → separate channel
    - matchers:
        - slo = "availability"
      receiver: 'slo-webhook'
      group_wait: 0s

receivers:
  # ── Default webhook (stub — replace URL with real endpoint) ──
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://localhost:9999/alerts/default'
        send_resolved: true
        http_config:
          bearer_token: 'REPLACE_WITH_REAL_TOKEN'
    # Slack stub (uncomment and fill in when ready)
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/REPLACE/WITH/REAL'
    #     channel: '#homeland-alerts'
    #     send_resolved: true
    #     title: '{{ .CommonAnnotations.summary }}'
    #     text: '{{ .CommonAnnotations.description }}'

  # ── Critical channel ──
  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://localhost:9999/alerts/critical'
        send_resolved: true
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/REPLACE/WITH/REAL'
    #     channel: '#homeland-critical'
    #     send_resolved: true

  # ── AI team channel ──
  - name: 'ai-team-webhook'
    webhook_configs:
      - url: 'http://localhost:9999/alerts/ai'
        send_resolved: true

  # ── SLO burn channel ──
  - name: 'slo-webhook'
    webhook_configs:
      - url: 'http://localhost:9999/alerts/slo'
        send_resolved: true

inhibit_rules:
  # Silence warning-level alerts when critical fires for the same alertname
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'team']
