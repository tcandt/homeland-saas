apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      # Derived fields: extract traceId from logs → link to Tempo
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          name: TraceID
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      # Link from Tempo trace → Loki logs via correlationId
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{compose_service="api"} | json | traceId="$${__trace.traceId}"'
      # Enable service graph
      serviceMap:
        datasourceUid: prometheus
      # Node graph
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
