groups:
  # ============================================================
  # Group 1: API Availability
  # ============================================================
  - name: homeland.api.availability
    interval: 30s
    rules:
      - alert: APIDown
        expr: up{job="homeland-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "HomeLand API is DOWN"
          description: "The homeland-api scrape target has been unreachable for > 1 minute."
          runbook: "https://github.com/org/homeland/blob/main/RUNBOOK.md#api-down"

  # ============================================================
  # Group 2: HTTP Error Rate
  # ============================================================
  - name: homeland.http.errors
    interval: 30s
    rules:
      - alert: HighErrorRate5xx
        expr: |
          (
            sum(rate(http_errors_total{status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "HTTP 5xx error rate > 5%"
          description: "5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighErrorRate4xx
        expr: |
          (
            sum(rate(http_errors_total{status=~"4.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.10
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "HTTP 4xx error rate > 10%"
          description: "4xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

  # ============================================================
  # Group 3: Latency SLO
  # ============================================================
  - name: homeland.latency.slo
    interval: 30s
    rules:
      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[10m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "P95 API latency > 2s"
          description: "P95 request duration is {{ $value | humanizeDuration }} (threshold: 2s)."

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[10m])) by (le)
          ) > 5
        for: 10m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "P99 API latency > 5s"
          description: "P99 request duration is {{ $value | humanizeDuration }} (threshold: 5s)."

  # ============================================================
  # Group 4: Business & Application Metrics
  # ============================================================
  - name: homeland.business
    interval: 60s
    rules:
      - alert: NotificationQueueBacklog
        expr: sum(notification_queue_items{status=~"FAILED|DEAD_LETTER"}) > 10
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Notification queue failures > 10"
          description: "{{ $value }} notifications have failed to send in the current window."

      - alert: NotificationDeadLetter
        expr: sum(notification_queue_items{status="DEAD_LETTER"}) > 0
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Notification dead-letter queue is not empty"
          description: "{{ $value }} notification jobs exhausted retry and require manual handling."

      - alert: NotificationWorkerHeartbeatStale
        expr: notification_worker_heartbeat_age_seconds > 300
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Notification worker heartbeat is stale"
          description: "The notification worker heartbeat is older than 5 minutes while queue delivery is expected out-of-process."

      - alert: NotificationQueueOldestPendingStale
        expr: notification_queue_oldest_age_seconds > 900
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Notification queue oldest pending item is stale"
          description: "The oldest active notification queue item has been pending for {{ $value | humanizeDuration }}."

      - alert: SePayWebhookFailed
        expr: sum(payment_webhook_logs{provider="SEPAY",status="FAILED"}) > 0
        for: 5m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "SePay webhook processing failed"
          description: "{{ $value }} SePay webhook logs are FAILED and may need replay or manual reconciliation."

      - alert: SePayWebhookNeedsReview
        expr: sum(payment_webhook_logs{provider="SEPAY",status="NEEDS_REVIEW"}) > 0
        for: 15m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "SePay webhook needs manual review"
          description: "{{ $value }} SePay webhook logs need review for unmatched, wrong-bank, short or overpaid transactions."

      - alert: SePayCriticalReconciliationIssue
        expr: sum(sepay_reconciliation_audit_issues{severity="critical"}) > 0
        for: 10m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "SePay reconciliation has critical cross-service mismatches"
          description: "{{ $value }} critical SePay reconciliation audit issues are open across request/webhook/source state."

      - alert: SePayRefundPendingStale
        expr: sum(sepay_reconciliation_audit_issues{type="OVERPAYMENT_REFUND_PENDING_STALE"}) > 0
        for: 30m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "SePay refund-pending overpayment is stale"
          description: "{{ $value }} SePay overpayment refund tasks have exceeded the stale threshold."

      - alert: BackupMissingOrFailed
        expr: backup_last_success == 0
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Latest backup manifest is missing or failed"
          description: "The API could not confirm a successful latest backup manifest."

      - alert: BackupOffHostMissing
        expr: backup_off_host_last_success == 0
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Latest successful backup is not confirmed off-host"
          description: "The latest successful backup manifest does not include an off-host location."

      - alert: BackupStale
        expr: backup_age_seconds > 93600
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Latest successful backup is stale"
          description: "Latest successful backup age is {{ $value | humanizeDuration }}, above the 26h threshold."

      - alert: BackupRetentionPrunableGrowing
        expr: backup_retention_prunable_copies > 10
        for: 2h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Local backup copies are accumulating beyond retention"
          description: "{{ $value }} local backup copies are marked prunable by the latest retention report."

      - alert: HunonicSyncFailed
        expr: sum(hunonic_sync_latest_status{status="FAILED"}) > 0
        for: 15m
        labels:
          severity: warning
          team: operations
        annotations:
          summary: "Hunonic sync latest status is FAILED"
          description: "{{ $value }} enabled Hunonic tenants have latest sync status FAILED."

      - alert: HunonicSyncStale
        expr: hunonic_sync_enabled_tenants > 0 and hunonic_sync_oldest_age_seconds > 7200
        for: 30m
        labels:
          severity: warning
          team: operations
        annotations:
          summary: "Hunonic sync is stale"
          description: "The oldest latest Hunonic sync observation across enabled tenants is older than 2 hours."

      - alert: HunonicSyncMissingLogs
        expr: hunonic_sync_missing_tenants > 0
        for: 30m
        labels:
          severity: warning
          team: operations
        annotations:
          summary: "Hunonic enabled tenants are missing sync logs"
          description: "{{ $value }} enabled Hunonic tenants do not have any sync log yet."

      - alert: AIHighErrorRate
        expr: |
          (
            sum(rate(http_errors_total{route=~".*/ai/.*"}[10m]))
            /
            (sum(rate(http_requests_total{route=~".*/ai/.*"}[10m])) + 0.001)
          ) > 0.10
        for: 10m
        labels:
          severity: warning
          team: ai
        annotations:
          summary: "AI endpoint error rate > 10%"
          description: "AI route error rate is {{ $value | humanizePercentage }} over the last 10 minutes."

      - alert: AutomationHighFailureRate
        expr: |
          (
            sum(rate(http_errors_total{route=~".*/automation/.*"}[10m]))
            /
            (sum(rate(http_requests_total{route=~".*/automation/.*"}[10m])) + 0.001)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Automation endpoint failure rate > 5%"
          description: "Automation route error rate is {{ $value | humanizePercentage }} over the last 10 minutes."

  # ============================================================
  # Group 5: SLO Burn Rate (Multi-window)
  # SLO target: 99.5% availability (error budget: 0.5%)
  # ============================================================
  - name: homeland.slo.burn
    interval: 60s
    rules:
      # Fast burn: 1h window, 14x burn rate → alert immediately
      - alert: SLOErrorBudgetFastBurn
        expr: |
          (
            sum(rate(http_errors_total[1h]))
            /
            (sum(rate(http_requests_total[1h])) + 0.001)
          ) > (14 * 0.005)
        for: 2m
        labels:
          severity: critical
          team: platform
          slo: availability
        annotations:
          summary: "SLO Error Budget burning too fast (fast burn)"
          description: |
            Current error rate {{ $value | humanizePercentage }} exceeds 14x the SLO burn threshold.
            At this rate, the monthly error budget will be exhausted in < 1 hour.

      # Slow burn: 6h window, 6x burn rate → alert before budget exhausted
      - alert: SLOErrorBudgetSlowBurn
        expr: |
          (
            sum(rate(http_errors_total[6h]))
            /
            (sum(rate(http_requests_total[6h])) + 0.001)
          ) > (6 * 0.005)
        for: 15m
        labels:
          severity: warning
          team: platform
          slo: availability
        annotations:
          summary: "SLO Error Budget burning (slow burn)"
          description: |
            Current 6h error rate {{ $value | humanizePercentage }} exceeds 6x the SLO burn threshold.
            Error budget may be exhausted within ~6 hours if this rate continues.
